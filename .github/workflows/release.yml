name: release

on:
  push:
    branches: [main]
  # Lets a failed or skipped publish be re-run from the Actions tab without an
  # empty commit. Set publish=true when package.json is already released (tag
  # exists, npm missing it). release-please itself is idempotent.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish package.json's version even if no new release was created"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # Opens (or updates) a "chore: release x.y.z" PR from conventional commits.
  # Merging that PR tags the repo and creates the GitHub release.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # workflow_dispatch inputs are null on push events, so compare to true.
    if: needs.release-please.outputs.released == 'true' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
      # No `registry-url`: it writes an .npmrc with a NODE_AUTH_TOKEN
      # placeholder, which conflicts with OIDC auth. The default registry is
      # already registry.npmjs.org.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      # No dependencies to install: the extension uses node: built-ins only.
      - run: npm test
      # Guard the manual path: never re-publish a version npm already has.
      - run: |
          have=$(npm view "$npm_package_name" version 2>/dev/null || echo none)
          if [ "$have" = "$npm_package_version" ]; then
            echo "::error::npm already has $have; refusing to publish"
            exit 1
          fi
          echo "publishing $npm_package_version (npm has $have)"
      # No token: npm exchanges the OIDC id-token for publish rights
      # (trusted publishing) and signs a provenance attestation. Requires the
      # one-time `npm trust github` in CONTRIBUTING.md.
      - run: npm publish
